on:
  push:
    branches:
      - uat
    paths:
      - data/output/UAT_processing/**
  workflow_dispatch:

name: upload_files_processing

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}  # Use the event name, branch reference, and workflow name as the concurrency group
  cancel-in-progress: true    # Cancel any in-progress runs in the same group

jobs:
  upload_files:
    runs-on: ${{ matrix.config.os }}
    environment: ${{ github.ref == 'refs/heads/main' && 'PROD' || 'UAT' }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: "release" }
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_TOKEN: ${{ secrets.AUTOMATISATION }}
      USERNAME: ${{ secrets.USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATISATION }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsodium-dev \
            libcurl4-openssl-dev \
            libgdal-dev \
            libproj-dev \
            libudunits2-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfontconfig1-dev \
            libuv1-dev

      - name: Install R packages
        run: |
          source("src/install_packages_upload_files.R")
          source("src/install_alienSpecies.R")
        shell: Rscript {0}

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: upload files
        run: |
          source("src/upload_processing_to_UAT.R")
        shell: Rscript {0}
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
