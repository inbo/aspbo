name: translation processing

on:
  workflow_dispatch: # Manual
  push:
    paths:
      # OLD directory these should be deleted when we make the switch
      - "data/output/UAT_direct/translations.csv"
      - "data/output/UAT_direct/translations_regions.csv"
      - "data/output/UAT_direct/translations_simple.csv"
      # NEW directory
      - "data/interim/translations/translations.csv"
      - "data/interim/translations/translations_regions.csv"
      - "data/interim/translations/translations_simple.csv"
 
# This job runs when the translation files are changed or manually when triggered 
# by workflow dispatch. Changes to the outputs are pushed to the branch where 
# the changes were made.

concurrency:
  group: process-translations-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs: 
  process-translations:
    runs-on: ${{ matrix.config.os }}
    name: process translations
    
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: "release" }
    
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_TOKEN: ${{ secrets.AUTOMATISATION }}
      
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATISATION }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsodium-dev libcurl4-openssl-dev libgdal-dev libproj-dev libudunits2-dev libharfbuzz-dev libfribidi-dev

      - name: install packages
        run: |
          source("src/Processing/install_packages_processing_translation_files.R")
        shell: Rscript {0}

      - name: process translations
        run: |
          source("src/Processing/run_processing_translation_files.R")
        shell: Rscript {0}
        
      - name: Commit and push changes
        uses: devops-infra/action-commit-push@v0.11.1
        with:
          github_token: ${{ secrets.AUTOMATISATION }}
          commit_prefix: "[AUTO]"
          commit_message: "processed translations"